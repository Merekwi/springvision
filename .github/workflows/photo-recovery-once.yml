name: SpringVision one-time photo recovery setup

on:
  push:
    branches:
      - main
    paths:
      - .github/dispatch/trigger-photo-recovery.txt

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Send photo recovery messages through Supabase
        env:
          SUPABASE_URL: https://dgdjddkaixjlscyqkpwz.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_8e6xqrd2MvKZ4hhTOhg09A_k4QxgSzN
          SPRINGVISION_CRON_SECRET: ${{ secrets.SPRINGVISION_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SPRINGVISION_CRON_SECRET:-}" ]]; then
            echo "::error::SPRINGVISION_CRON_SECRET is missing in GitHub Actions."
            exit 1
          fi
          fingerprint="$(printf '%s:springvision-photo-recovery-v1:2026-11-19' "$SPRINGVISION_CRON_SECRET" | sha256sum | cut -d' ' -f1)"
          echo "One-time verifier fingerprint: $fingerprint"
          echo "One-time verifier fingerprint: $fingerprint" >> "$GITHUB_STEP_SUMMARY"
          echo "Fingerprint calculated. The original secret was not printed."
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/api" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $SPRINGVISION_CRON_SECRET" \
            --data '{"action":"cron_jury_photo_dispatch"}')"
          echo "HTTP status: $http_status"
          cat "$response_file"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Photo recovery dispatch failed."
            exit 1
          fi
          cat "$response_file" >> "$GITHUB_STEP_SUMMARY"
