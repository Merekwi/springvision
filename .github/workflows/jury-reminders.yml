name: SpringVision jury reminders

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/jury-reminders.yml
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Check cron configuration and trigger reminders
        env:
          SUPABASE_URL: https://dgdjddkaixjlscyqkpwz.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_8e6xqrd2MvKZ4hhTOhg09A_k4QxgSzN
          SPRINGVISION_CRON_SECRET: ${{ secrets.SPRINGVISION_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

          if [[ -z "${SPRINGVISION_CRON_SECRET:-}" ]]; then
            echo "::warning::SPRINGVISION_CRON_SECRET is not configured in GitHub Actions. Jury reminders and automatic deadline processing were skipped."
            {
              echo "### SpringVision reminders were skipped"
              echo
              echo "GitHub Actions secret SPRINGVISION_CRON_SECRET is missing."
              echo "No reminder or deadline-processing request was sent to Supabase."
              echo "Configure this secret with the same value as SPRINGVISION_CRON_SECRET in the Supabase Edge Function environment."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if ! http_status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/api" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $SPRINGVISION_CRON_SECRET" \
            --data '{"action":"cron_jury_reminders"}')"; then
            echo "::error::Could not reach the SpringVision Supabase Edge Function."
            cat "$response_file"
            exit 1
          fi

          if [[ "$http_status" == "401" ]]; then
            echo "::warning::Supabase rejected the cron secret. Jury reminders and automatic deadline processing were not run."
            {
              echo "### SpringVision reminders were not run"
              echo
              echo "Supabase returned HTTP 401 (Unauthorized cron request)."
              echo "The GitHub Actions secret and the Supabase Edge Function secret SPRINGVISION_CRON_SECRET must contain exactly the same value."
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$response_file"
            exit 0
          fi

          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::SpringVision cron request failed with HTTP $http_status."
            cat "$response_file"
            exit 1
          fi

          cat "$response_file"
